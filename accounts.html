<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.in;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KATSAM Sistema de gestión para restaurantes - Cuentas</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="module-shell">
    <header class="module-header">
      <div class="header-left">
        <button class="btn-icon-back" data-nav-home>&#8592;</button>
        <img src="logo_saas.png" alt="KATSAM Sistema de gestión para restaurantes" class="header-logo">
        <div class="module-title">
          <h1>Cuentas</h1>
          <span>Usuarios y roles del sistema</span>
        </div>
      </div>
    </header>

    <div class="module-body" style="max-width: 900px;">
      <div class="section-toolbar">
        <h2>Usuarios</h2>
        <button id="btn-new-user" class="btn btn-brand">+ Nueva cuenta</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th></th></tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>

      <div class="panel" style="margin-top:24px;">
        <div class="section-toolbar" style="margin-bottom:14px;">
          <h2 style="font-size:1rem;">Roles y permisos</h2>
          <button id="btn-new-role" class="btn btn-outline btn-sm">+ Nuevo rol</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Rol</th><th>Descripción</th><th></th></tr>
            </thead>
            <tbody id="roles-tbody"></tbody>
          </table>
        </div>

        <div id="role-permissions-panel" style="display:none; margin-top:18px; border-top:1px solid var(--border-color); padding-top:16px;">
          <h3 id="role-permissions-title" style="font-size:0.95rem; margin-bottom:10px;"></h3>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>Módulo</th><th>Ver</th><th>Crear</th><th>Editar</th><th>Eliminar</th></tr>
              </thead>
              <tbody id="role-permissions-tbody"></tbody>
            </table>
          </div>
          <div class="modal-actions" style="justify-content:flex-start; margin-top:14px;">
            <button id="btn-save-role-permissions" class="btn btn-brand">Guardar permisos</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="role-modal" class="modal-overlay">
    <div class="modal-box">
      <h2 id="role-modal-title">Nuevo rol</h2>
      <input type="hidden" id="role-id">
      <div class="form-grid">
        <div class="field" style="grid-column: 1 / -1;">
          <label>Nombre del rol</label>
          <input type="text" id="role-name" placeholder="Ej. Supervisor de turno">
        </div>
        <div class="field" style="grid-column: 1 / -1;">
          <label>Descripción (opcional)</label>
          <input type="text" id="role-description">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="btn-cancel-role">Cancelar</button>
        <button class="btn btn-brand" id="btn-save-role">Guardar</button>
      </div>
    </div>
  </div>

  <div id="user-modal" class="modal-overlay">
    <div class="modal-box">
      <h2 id="user-modal-title">Nueva cuenta</h2>
      <input type="hidden" id="user-id">
      <div class="form-grid">
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="user-username" placeholder="cajero3">
        </div>
        <div class="field">
          <label>Nombre a mostrar</label>
          <input type="text" id="user-display-name" placeholder="Nombre completo">
        </div>
        <div class="field">
          <label>Rol</label>
          <select id="user-role"></select>
        </div>
        <div class="field">
          <label>Estado</label>
          <select id="user-active">
            <option value="1">Activo</option>
            <option value="0">Inactivo</option>
          </select>
        </div>
        <div class="field" style="grid-column: 1 / -1;">
          <label id="user-password-label">Contraseña</label>
          <input type="text" id="user-password" placeholder="Déjalo vacío para no cambiarla">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="btn-cancel-user">Cancelar</button>
        <button class="btn btn-brand" id="btn-save-user">Guardar</button>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="accounts-renderer.js"></script>
  <script src="order-alert.js"></script>
</body>
</html>
