<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Permite la comunicación por red y WebSockets hacia Supabase -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.in;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wings House - Iniciar sesión</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <img src="logo.png" alt="Wings House" class="login-logo">
      <h1>Wings House</h1>
      <p class="subtitle">Sistema administrativo</p>

      <form id="login-form" autocomplete="off">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="admin, cajero1, cajero2..." autofocus>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>
        <div id="login-error" class="login-error" style="display:none;"></div>
        <button type="submit" id="btn-login" class="btn-login">Entrar</button>
      </form>
    </div>
  </div>

  <script src="login-renderer.js"></script>
</body>
</html>
