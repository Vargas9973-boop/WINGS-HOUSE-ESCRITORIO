<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- CSP actualizada para permitir conexiones HTTP y WebSockets a Supabase -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.in;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wings House Admin - Panel de Control</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <div class="logo-background"></div>

    <header class="app-header">
      <img src="logo.png" alt="Wings House Logo" class="header-logo" width="160" height="auto">
      <p>Selecciona una sección con las flechas o haz clic en la opción central</p>
      <div id="user-badge-index"></div>
    </header>

    <main class="carousel-container">
      <button id="prev-btn" class="nav-btn" aria-label="Anterior">&#10094;</button>
      
      <div class="carousel-viewport">
        <div id="carousel-track" class="carousel-track">
          <!-- Opciones cargadas por renderer.js -->
        </div>
      </div>

      <button id="next-btn" class="nav-btn" aria-label="Siguiente">&#10095;</button>
    </main>

    <footer class="app-footer">
      <div id="selected-info" class="selected-info">
        Iniciando sistema...
      </div>
    </footer>
  </div>

  <script src="common.js"></script>
  <script src="renderer.js"></script>
  <script src="order-alert.js"></script>
</body>
</html>
